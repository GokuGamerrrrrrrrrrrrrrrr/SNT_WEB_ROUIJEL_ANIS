<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archives Privées - NASA</title>
    
    <style>
        /* DESIGN GENERAL PREMIUM (STYLE NASA CYBER) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f1f5f9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            
            /* Paramètres pour que le fond image s'étire parfaitement */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background 0.4s ease;
        }

        /* BANDEAU VIDÉO PLEIN ÉCRAN */
        #videoFond {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -100; /* Reste derrière le texte */
            object-fit: cover; /* S'étire sans déformer */
            display: none; /* Masqué tant qu'on ne clique pas sur le bouton vidéo */
        }

        /* CONTENEUR PRINCIPAL */
        .wrapper {
            max-width: 1200px;
            width: 100%;
            text-align: center;
            backdrop-filter
            backdrop-filter: blur(0px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        h1:not(.texte-multicolore) {
            font-size: 2.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .avertissement {
            color: #ff4757;
            font-weight: 600;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        /* GRILLE DE MÉDIAS (4 EMPLACEMENTS) */
        .grille-medias {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            margin-bottom: 40px; 
        }

        /* CARTES DE LA GALERIE */
        .bloc-element {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .bloc-element:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.15);
        }

        /* Ajustement des images et vidéos */
        .media-item {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #000;
        }

        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex-grow: 1;
            justify-content: space-between;
        }
        .card-title {
            font-size: 1rem;
            font-weight: bold;
            color: #cbd5e1;
            margin: 0 0 10px 0;
        }

        /* BOUTONS FOND D'ÉCRAN */
        .btn-fond {
            padding: 10px 14px;
            cursor: pointer;
            background: transparent;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        .btn-fond:hover {
            background: #38bdf8;
            color: #0b0e14;
        }

        /* BOUTONS ACTIONS */
        .zone-actions {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-action {
            padding: 12px 24px;
            margin: 5px;
            cursor: pointer;
            background: #1e293b;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            font-weight: 600;
        }

        #texte {
            font-size: 1.1rem;
            color: #94a3b8;
            margin: 25px 0 10px 0;
        }

        /* TEXTE MULTICOLORE ANIMÉ */
        .texte-multicolore {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(to right, #ff4757, #ffa502, #2ed573, #1e90ff, #9b59b6, #ff4757);
            background-size: 400% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: arcenciel 4s linear infinite;
            margin: 25px 0;
        }

        @keyframes arcenciel {
            0% { background-position: 0% center; }
            100% { background-position: 400% center; }
        }
    </style>
</head>
<!-- LE FOND DE LA BALISE EST DÉFINI COMME TOTALEMENT TRANSPARENT ICI -->
<body style="background-color: rgba(255, 255, 255, 0) !important;">

    <!-- LA BALISE VIDÉO UNIQUE POUR LE FOND D'ÉCRAN LIVE -->
    <video id="videoFond" autoplay loop muted playsinline></video>

    <!-- LA MUSIQUE DE FOND CACHÉE SANS LECTEUR GRIS -->
    <audio id="musiqueFond" loop>
        <source src="musique.mp3" type="audio/mpeg">
    </audio>

    <!-- PANNEAU CENTRAL -->
    <div class="wrapper">

        <h1>Archives de la NASA</h1>
        <p class="avertissement">⚠️ Certaines images peuvent être sensibles, déconseillé aux moins de 15 ans !</p>
        
        <!-- LES 4 EMPLACEMENTS DE MÉDIAS -->
        <div class="grille-medias">
            
            <!-- EMPLACEMENT 1 : IMAGE 1 -->
            <div class="bloc-element">
                <img class="media-item" src="image.jpg" alt="Archive 01">
                <div class="card-body">
                    <p class="card-title">Archive Photo Alpha</p>
                    <button class="btn-fond" onclick="mettreImageEnFond('image.jpg')">Utiliser comme fond</button>
                </div>
            </div>

            <!-- EMPLACEMENT 2 : VIDÉO 1 -->
            <div class="bloc-element">
                <video class="media-item" autoplay loop muted playsinline>
                    <source src="video.mp4" type="video/mp4">
                </video>
                <div class="card-body">
                    <p class="card-title">Flux Vidéo en Temps Réel</p>
                    <button class="btn-fond" onclick="mettreVideoEnFond('video.mp4')">Utiliser comme fond</button>
                </div>
            </div>

            <!-- EMPLACEMENT 3 : IMAGE 2 -->
            <div class="bloc-element">
                <img class="media-item" src="image2.jpg" alt="Archive 02">
                <div class="card-body">
                    <p class="card-title">Cliché Satellite Gamma</p>
                    <button class="btn-fond" onclick="mettreImageEnFond('image2.jpg')">Utiliser comme fond</button>
                </div>
            </div>

            <!-- EMPLACEMENT 4 : VIDÉO 2 -->
            <div class="bloc-element">
                <video class="media-item" autoplay loop muted playsinline>
                    <source src="video2.mp4" type="video/mp4">
                </video>
                <div class="card-body">
                    <p class="card-title">Sonde Spatiale Orbiteur</p>
                    <button class="btn-fond" onclick="mettreVideoEnFond('video2.mp4')">Utiliser comme fond</button>
                </div>
            </div>

        </div>

        <!-- ZONE ACTIONS ET FORMULAIRE -->
        <div class="zone-actions">
            <button class="btn-action" onclick="alert('Merci de patienter, nous collectons votre adresse IP')">Présentation</button>
            <button class="btn-action" onclick="alert('Merci de patienter, nous injectons le virus ALPHA SCP')">Voir les mèmes</button>
            
            <p id="texte">Soutenez les petits créateurs !</p>
            
            <h1 class="texte-multicolore">Devenez ambassadeur avec le formulaire ci-dessous</h1>
            
            <button class="btn-action" style="background: #38bdf8; color: #0b0e14;" onclick="changerTexte()">Formulaire</button>
        </div>

    </div>

<script>
function changerTexte() {
    document.getElementById("texte").innerHTML = "🚀 Merci de votre soutien de 10$, cela m'aide beaucoup !";
}

// ACTION : PASSER UNE IMAGE EN FOND D'ÉCRAN GLOBAL
function mettreImageEnFond(lienImage) {
    var vid = document.getElementById("videoFond");
    vid.style.display = "none"; // Masque totalement la vidéo
    vid.pause(); // Coupe la lecture de la vidéo en tâche de fond
    
    // Supprime la transparence forcée pour laisser place à l'image chargée
    document.body.style.setProperty("background-color", "transparent", "important");
    document.body.style.backgroundImage = "url('" + lienImage + "')"; 
}

// ACTION : PASSER UNE VIDÉO EN FOND D'ÉCRAN GLOBAL
function mettreVideoEnFond(lienVideo) {
    document.body.style.backgroundImage = "none"; // Enlevez l'image de fond
    
    var vid = document.getElementById("videoFond");
    vid.src = lienVideo; // Assigne le nouveau fichier vidéo
    vid.style.display = "block"; // Affiche la vidéo plein écran
    vid.play(); // Force la lecture
}

// GESTION DU SON AU CLIC GENERAL
document.addEventListener('click', function() {
    var audio = document.getElementById('musiqueFond');
    if (audio.paused) {
        audio.play().catch(function(e) { console.log("Lecture audio bloquée."); });
    }
}, { once: true });
</script>

</body>
</html>
