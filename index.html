<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archives Privées - NASA</title>
    
    <style>
        /* DESIGN GENERAL PREMIUM (STYLE NASA CYBER) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f1f5f9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background 0.4s ease;
            background-color: #0b0e14;
        }

        /* BANDEAU VIDÉO PLEIN ÉCRAN */
        #videoFond {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -100;
            object-fit: cover;
            display: none;
        }

        /* CONTENEUR PRINCIPAL */
        .wrapper {
            max-width: 1200px;
            width: 100%;
            text-align: center;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        h1:not(.texte-multicolore) {
            font-size: 2.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .avertissement {
            color: #ff4757;
            font-weight: 600;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        /* GRILLE DE MÉDIAS */
        .grille-medias {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            margin-bottom: 40px; 
        }

        .bloc-element {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .bloc-element:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.15);
        }

        .media-item {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #000;
        }

        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex-grow: 1;
            justify-content: space-between;
        }
        .card-title {
            font-size: 1rem;
            font-weight: bold;
            color: #cbd5e1;
            margin: 0 0 10px 0;
        }

        .btn-fond {
            padding: 10px 14px;
            cursor: pointer;
            background: transparent;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        .btn-fond:hover {
            background: #38bdf8;
            color: #0b0e14;
        }

        /* BOUTONS ACTIONS */
        .zone-actions {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .conteneur-boutons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .btn-action {
            padding: 12px 24px;
            cursor: pointer;
            background: #1e293b;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-action:hover {
            background: #334155;
        }

        #texte {
            font-size: 1.1rem;
            color: #94a3b8;
            margin: 15px 0 0 0;
        }
    </style>
</head>
<body style="background-color: rgba(255, 255, 255, 0) !important;">

    <video id="videoFond" autoplay loop playsinline></video>

</audio>

    </audio>

    <div class="wrapper">
        <h1>Archives de la NASA</h1>
        <p class="avertissement">⚠️ Certaines images peuvent être sensibles, déconseillé aux moins de 15 ans !</p>
        
        <div class="grille-medias">
            <!-- Emplacement 1 -->
            <div class="bloc-element">
                <img class="media-item" src="image.jpg" alt="Archive 01">
                <div class="card-body">
                    <p class="card-title">Archive Photo Alpha</p>
                    <button class="btn-fond" onclick="mettreImageEnFond('image.jpg')">Utiliser comme fond</button>
                </div>
            </div>
            <!-- Emplacement 2 -->
            <div class="bloc-element">
                <video class="media-item" autoplay loop playsinline>
                    <source src="video.mp4" type="video/mp4">
                </video>
                <div class="card-body">
                    <p class="card-title">Flux Vidéo en Temps Réel</p>
                    <button class="btn-fond" onclick="mettreVideoEnFond('video.mp4')">Utiliser comme fond</button>
                </div>
            </div>
            <!-- Emplacement 3 -->
            <div class="bloc-element">
                <img class="media-item" src="image2.jpg" alt="Archive 02">
                <div class="card-body">
                    <p class="card-title">Cliché Satellite Gamma</p>
                    <button class="btn-fond" onclick="mettreImageEnFond('image2.jpg')">Utiliser comme fond</button>
                </div>
            </div>
            <!-- Emplacement 4 -->
            <div class="bloc-element">
                <video class="media-item" autoplay loop playsinline>
                    <source src="video2.mp4" type="video/mp4">
                </video>
                <div class="card-body">
                    <p class="card-title">Sonde Spatiale Orbiteur</p>
                    <button class="btn-fond" onclick="mettreVideoEnFond('video2.mp4')">Utiliser comme fond</button>
                </div>
            </div>
        </div>

        <!-- ZONE ACTIONS MODIFIÉE -->
        <div class="zone-actions">
            <div class="conteneur-boutons">
                <button class="btn-action" onclick="alert('Merci de patienter, nous collectons votre adresse IP')">Présentation</button>
                <button class="btn-action" onclick="alert('Merci de patienter, nous injectons le virus ALPHA SCP')">Voir les mèmes</button>
            </div>
            
            <!-- VOTRE BOUTON PERSONNALISÉ ICI -->
            <button class="btn-action" style="background: #38bdf8; color: #0b0e14;" onclick="changerTexte()">Formulaire</button>
            
            <p id="texte">Chargement prêt</p>
        </div>
    </div>

    <script>
        const videoFond = document.getElementById('videoFond');

        function mettreImageEnFond(nomImage) {
            videoFond.style.display = 'none';
            videoFond.pause();
            document.body.style.backgroundImage = `url('${nomImage}')`;
        }

        function mettreVideoEnFond(nomVideo) {
            document.body.style.backgroundImage = 'none';
            videoFond.src = nomVideo;
            videoFond.style.display = 'block';
            videoFond.load();
            videoFond.play().catch(e => console.log(e));
        }

        // LA FONCTION DU BOUTON FORMULAIRE ICI
        function changerTexte() {
            const paragrapheTexte = document.getElementById('texte');
            paragrapheTexte.innerHTML = "🚀 Connexion établie... Redirection vers la page 2 en cours !";
            paragrapheTexte.style.color = "#38bdf8";

            setTimeout(function() {
                window.location.href = "page2.html";
            }, 1500); 
        }
    </script>
</body>
</html>
