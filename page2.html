<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 2 - Archives Secrètes NASA</title>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f1f5f9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            background-color: #0b0e14;
        }

        .wrapper {
            max-width: 800px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            background: rgba(30, 41, 59, 0.4);
            margin-top: 50px;
        }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #38bdf8;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-retour {
            display: inline-block;
            padding: 12px 24px;
            background: #1e293b;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-retour:hover {
            background: #334155;
            border-color: #38bdf8;
            color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <h1>🚀 Niveau d'accès : Autorisé</h1>
        <p>Bienvenue sur la deuxième page des archives de la NASA. Les systèmes de sécurité ont validé votre profil. Vous pouvez consulter les données confidentielles à présent.</p>
        
        <!-- BOUTON DE RETOUR VERS LA PREMIÈRE PAGE -->
        <a href="index.html" class="btn-retour">⬅ Retour à la Galerie</a>
    </div>

</body>
</html>
